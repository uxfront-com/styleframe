# npm trusted publishing names this file, `changesets.yml`, as the workflow
# that may publish Styleframe's packages. Never rename or move it: the publish
# would then fail with a misleading E404.
#
# The release itself runs in the shared workflow in uxfront-com/.github, pinned
# by commit SHA. It opens or updates the "chore: update versions" PR while
# changesets are pending, and publishes to npm when that PR merges.
name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one release runs at a time, and a waiting one is never cancelled
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A called workflow can only lower these. npm needs `id-token: write`
    # here too, and the shared workflow passes it on only to its publish job.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: uxfront-com/.github/.github/workflows/release.yml@18a1d7cb1576c8053a80f3d166cfefecd470f5b3 # main
    with:
      build: pnpm run ci:prepublish
      version-script: pnpm ci:version
      commit-message: "chore: update versions"
      pr-title: "chore: update versions"
