  '@microsoft/api-extractor': ^7.60.1
  '@playwright/test': ^1.65.1
  '@styleframe/license': ^2.0.2
  '@types/node': ^22.20.5
  '@uxfront/oxlint-config': ^0.2.0
  '@uxfront/typescript-config': ^0.2.0
  '@vitest/coverage-v8': ^4.1.8
  bumpp: ^10.4.1
  chokidar: ^4.0.3
  consola: ^3.4.2
  culori: ^4.0.2
  defu: 6.1.7
  husky: ^9.1.7
  importree: ^2.0.1
  jiti: ^2.7.0
  jsdom: ^29.1.1
  lint-staged: ^17.6.2
  npm-run-all2: ^9.1.0
  nuxt: 4.6.4
  oxfmt: ^0.79.0
  oxlint: ^1.95.0
  playwright: ^1.65.1
  scule: ^1.3.0
  tinyglobby: ^0.2.17
  tsdown: ^0.23.7
  tsx: ^4.23.15
  turbo: ^2.11.13
  typescript: ^7.0.2
  unplugin-dts: ^1.1.2
  vite: ^8.3.8
  vite-plugin-dts: ^5.1.2
  vite-plugin-node: ^8.0.0
  vitest: ^4.1.8
  zod: ^4.6.7

catalogs:
  # The docs app (apps/docs) runs on Open Components' setup, at its versions: Docus
  # on the UXFront layers. The other apps stay on `nuxt`, and share its `vue`.
  docs:
    '@iconify-json/lucide': ^1.2.158
    '@iconify-json/simple-icons': ^1.2.103
    '@iconify-json/vscode-icons': ^1.2.100
    '@nuxt/content': ^3.17.0
    '@nuxt/kit': ^4.6.4
    '@uxfront/layer-docs': ^0.9.1
    '@uxfront/layer-ui': ^0.1.11
    '@uxfront/scene': ^0.5.1
    '@uxfront/site-checks': 0.1.0
    '@uxfront/ui': ^0.9.1
    '@vueuse/core': ^14.4.0
    docus: ^5.15.0
    # Nitro 2 runs h3 1, but Nuxt can find the docs server's h3 types through
    # pnpm's hoisting, which may pick the h3 2 of Docus's MCP toolkit and fail
    # the typecheck. The app's own h3 keeps both on 1.
    h3: ^1.15.11
    nuxt: ^4.5.2
    vue-router: ^5.3.1
  nuxt:
    '@iconify-json/devicon': 1.2.84
    '@iconify-json/lucide': 1.2.112
    '@iconify-json/material-symbols': 1.2.101
    '@iconify-json/mdi': 1.2.3
    '@iconify-json/simple-icons': 1.2.86
    '@iconify-json/vscode-icons': 1.2.57
    '@nuxt/content': 3.14.0
    '@nuxt/eslint': 1.17.0
    '@nuxt/fonts': 1.2.0
    '@nuxt/image': 1.11.0
    '@nuxt/kit': 4.4.8
    '@nuxt/schema': 4.6.4
    '@nuxt/scripts': 0.11.13
    '@nuxt/test-utils': 3.19.2
    '@nuxt/ui': 4.13.0
    '@nuxtjs/i18n': 10.6.0
    '@nuxtjs/mdc': 0.23.4
    '@nuxtjs/robots': 6.1.1
    '@nuxtjs/sitemap': 9.1.0
    '@nuxtjs/supabase': 2.1.0
    '@supabase/supabase-js': ^2.119.2
    '@unhead/vue': 2.0.19
    '@vitejs/plugin-vue': ^6.0.11
    '@vue/tsconfig': ^0.9.1
    '@vueuse/core': 14.3.0
    better-sqlite3: ^12.10.1
    c12: 3.3.4

    exsolve: 1.2.0
    git-url-parse: 16.1.0
    minimark: 0.2.0
    motion-v: 1.7.2
    nuxt: 4.4.8
    nuxt-llms: 0.3.2
    nuxt-og-image: 6.6.0
    pkg-types: 2.4.0
    posthog-js: 1.454.0
    tailwindcss: 4.3.5
    typescript: ^6.0.3
    ufo: 1.6.4
    unist-util-visit: 5.2.0
    vite: ^8.3.8
    vue: ^3.5.46
    vue-router: 4.5.1
    vue-tsc: ^3.3.14

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# pnpm 11 rejects versions published in the last 24 hours. This first-party
# version was published on 2026-11-24, so it is excluded by exact version.
minimumReleaseAgeExclude:
  - '@uxfront/layer-docs@0.9.1'

# These modules import `nuxt` at runtime without depending on it, so they ran
# whichever Nuxt pnpm hoisted, which needn't be the app's: the docs app runs a
# newer one than the others. As peers, each resolves its app's.
packageExtensions:
  '@nuxt/content':
    peerDependencies:
      nuxt: '*'
  '@nuxt/scripts':
    peerDependencies:
      nuxt: '*'
  '@nuxtjs/mdc':
    peerDependencies:
      nuxt: '*'
  '@nuxtjs/robots':
    peerDependencies:
      nuxt: '*'
  nuxt-og-image:
    peerDependencies:
      nuxt: '*'
  # Its types import @farmfe/core without declaring it, so @styleframe/plugin's
  # build resolved whichever @farmfe/core pnpm hoisted, and failed when that
  # wasn't the plugin's own. Later versions declare the same optional peer.
  unplugin@3.0.0:
    peerDependencies:
      '@farmfe/core': '*'
    peerDependenciesMeta:
      '@farmfe/core':
        optional: true
